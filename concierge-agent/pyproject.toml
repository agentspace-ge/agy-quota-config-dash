[project]
name = "antigravity-quota-concierge"
version = "1.0.0"
description = "Antigravity Quota Concierge — Optional Gemini Enterprise Multi-Agent ADK Add-On"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-aiplatform[agent_engines,adk]>=1.129.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["antigravity_quota_concierge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
